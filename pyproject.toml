[project]
name = "carodi"
version = "0.1.0"
description = "Personal opportunity funnel: pluggable sources -> eligibility filter -> Telegram digest"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
carodi = "carodi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carodi*"]
