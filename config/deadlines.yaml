# Curated deadline calendar.
#
# VERIFIED 2026-08-08 against each programme's official page or, where the
# official site blocked automated access, two independent sources that agreed.
# Entries still carrying `verify-date` are ones whose next-cycle dates the
# organisers have not published yet; they hold last cycle's pattern.
#
# `recurring: true` rolls a past date forward to its next annual occurrence.
# Set `recurring: false` for a one-off date that should simply expire.
#
# Fields: name, url, deadline, kind, org, countries, tags, notes, recurring

# ---------------------------------------------------------------------------
# IMMINENT
# ---------------------------------------------------------------------------

- name: DAAD Study Scholarships — STEM / innovation fields
  url: https://www.daad-jordan.org/en/find-funding/scholarship-database/
  deadline: 2026-08-31
  kind: scholarship
  org: DAAD
  countries: [DE]
  tags: [masters, fully-funded, stem, verified-2026-08-08]
  notes: >
    Master's in innovation-driving STEM fields, explicitly open to applicants
    from developing and emerging countries — Jordan qualifies. Selection
    February 2027, funding starts May 2027. This is the single best-matched
    entry in this file for a computer engineering graduate and it closes
    within weeks. Confirm the exact date in the DAAD Jordan database.

- name: Chevening Scholarships (UK)
  url: https://www.chevening.org/scholarships/application-timeline/
  deadline: 2026-10-06
  kind: scholarship
  org: UK FCDO
  countries: [GB]
  tags: [masters, fully-funded, verified-2026-08-08]
  notes: >
    Closes 11:00 UTC on 6 October 2026; applications opened 4 August 2026.
    Fully funded UK master's, Jordan eligible. Requires roughly two years of
    work experience — check whether internships and part-time work count for
    you before investing in the essays. Successful candidates must hold an
    unconditional UK offer by 8 July 2027.

- name: DAAD Study Scholarships — all disciplines
  url: https://www2.daad.de/deutschland/stipendium/datenbank/en/21148-scholarship-database/
  deadline: 2026-10-30
  kind: scholarship
  org: DAAD
  countries: [DE]
  tags: [masters, verified-2026-08-08]
  notes: >
    The general track, distinct from the STEM call above. Applications open
    1 September. Deadlines vary by programme and country of origin, so filter
    the database for Jordan rather than trusting this date alone.

# ---------------------------------------------------------------------------
# AUTUMN / WINTER
# ---------------------------------------------------------------------------

- name: ETH Zurich Excellence Scholarship (ESOP)
  url: https://ethz.ch/students/en/studies/financial/scholarships/excellencescholarship.html
  deadline: 2026-11-30
  kind: scholarship
  org: ETH Zurich
  countries: [CH]
  tags: [masters, fully-funded, verified-2026-08-08]
  notes: >
    Application window is 1–30 November 2026 only, for a Master's start in
    autumn 2027. Applied for through eApply as part of the Master application.
    Needs roughly top-10% Bachelor results. CHF 12,000 per semester plus a
    tuition waiver.

- name: Erasmus Mundus Joint Masters — pick your programmes
  url: https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en
  deadline: 2026-11-15
  kind: scholarship
  org: European Commission
  countries: [DE, NL, SE, FR, ES, IT, BE, PT]
  tags: [masters, fully-funded, verified-2026-08-08]
  notes: >
    Not a single deadline. The Commission selected 37 new joint masters on
    16 July 2026; consortia open applications through autumn 2026 with their
    own deadlines, mostly November to January, a few into February. You may
    apply to up to three. Treat this alert as the prompt to browse the
    catalogue and add the three you actually want as their own entries with
    their real dates.

- name: TU Delft Justus & Louise van Effen Excellence Scholarship
  url: https://www.tudelft.nl/en/education/practical-matters/scholarships
  deadline: 2026-12-01
  kind: scholarship
  org: TU Delft
  countries: [NL]
  tags: [masters, fully-funded, verified-2026-08-08]
  notes: >
    23:59 CET on 1 December 2026. Requires a completed MSc programme
    application by the same moment, plus a scholarship form and two reference
    letters. Covers tuition and a living contribution. Two-year regular MSc
    programmes only, not joint programmes.

- name: Oxford graduate application (Clarendon consideration)
  url: https://www.ox.ac.uk/clarendon
  deadline: 2026-12-01
  kind: scholarship
  org: University of Oxford
  countries: [GB]
  tags: [masters, phd, verified-2026-08-08]
  notes: >
    There is no separate Clarendon application — you are considered
    automatically if you meet your course's funding deadline, which is early
    December 2026 or early January 2027 depending on the course. This entry
    uses the December date because missing it by one day disqualifies you
    regardless of profile. Check your specific course page.

- name: Gates Cambridge Scholarship
  url: https://www.gatescambridge.org/apply/timeline/
  deadline: 2026-12-08
  kind: scholarship
  org: University of Cambridge
  countries: [GB]
  tags: [masters, phd, fully-funded, verified-2026-08-08]
  notes: >
    Main international round is 8 December 2026 or 6 January 2027 by course;
    this entry uses the earlier. Midnight GMT. Applied for inside the standard
    Cambridge postgraduate application, not separately. The 14 October 2026
    round is for US citizens resident in the USA and does not apply to you.

