# Curated deadline calendar.
#
# IMPORTANT: the dates below are the *typical* month/day each programme has used,
# seeded so the calendar is useful on day one. They are not authoritative and
# several shift by weeks year to year. Open each URL, confirm the real date, and
# correct this file — it takes one afternoon and it is the highest-value hour of
# work in this whole project.
#
# `recurring: true` rolls a past date forward to its next annual occurrence.
# Set `recurring: false` for one-off deadlines.
#
# Fields: name, url, deadline, kind, org, countries, tags, notes, recurring

- name: Chevening Scholarships (UK)
  url: https://www.chevening.org/scholarships/
  deadline: 2026-11-04
  kind: scholarship
  org: UK FCDO
  countries: [GB]
  tags: [masters, fully-funded, verify-date]
  notes: >
    Fully funded UK master's. Jordan is an eligible country. Requires ~2 years
    work experience — check whether internships/part-time count for you.

- name: Erasmus Mundus Joint Masters — application window opens
  url: https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en
  deadline: 2026-10-15
  kind: scholarship
  org: European Commission
  countries: [DE, NL, SE, FR, ES, IT, BE, PT]
  tags: [masters, fully-funded, verify-date]
  notes: >
    Each consortium sets its own deadline (mostly Dec–Feb). Browse the catalogue
