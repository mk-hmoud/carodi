- name: France Excellence Eiffel Scholarship
  url: https://www.campusfrance.org/en/france-excellence-eiffel-scholarship-program
  deadline: 2027-01-08
  kind: scholarship
  org: Campus France
  countries: [FR]
  tags: [masters, verified-2026-08-08]
  notes: >
    You cannot apply directly — only French institutions may submit
    candidates, so the date that matters to you is each school's internal
    nomination cut-off, typically weeks to months earlier. Contact target
    schools in autumn 2026 or this deadline is already unreachable.
    €1,200/month for master's students.

- name: Swedish master's applications (prerequisite for SISGP)
  url: https://www.universityadmissions.se/
  deadline: 2027-01-15
  kind: scholarship
  org: Swedish Institute
  countries: [SE]
  tags: [masters, fully-funded, prerequisite, verify-date]
  notes: >
    The SISGP scholarship portal opens in February, but you must already have
    applied to Swedish master's programmes through universityadmissions.se by
    mid-January — miss this and the scholarship deadline is moot. Dates shown
    follow the 2026/27 cycle (admission 15 Jan, portal 9–25 Feb); the 2027/28
    dates are usually published in autumn. Confirm Jordan is on the eligible
    country list, which changes between cycles.

- name: NL Scholarship (formerly Holland Scholarship)
  url: https://www.studyinnl.org/finances/nl-scholarship
  deadline: 2027-02-01
  kind: scholarship
  org: Dutch Ministry of Education
  countries: [NL]
  tags: [masters, partial, verified-2026-08-08]
  notes: >
    Renamed from Holland Scholarship. €5,000 one-off, not full tuition. Applied
    for directly at the institution, each of which sets its own deadline —
    either 1 February or 1 May. This entry uses the earlier; check your chosen
    university. Non-EEA students only, which you are.

