- name: Fulbright Foreign Student Program (Jordan) — window opens
  url: https://www.fulbright.org.jo/jordanian-programs/jordanian-student-scholarship
  deadline: 2027-02-01
  kind: scholarship
  org: Jordanian-American Commission for Educational Exchange
  countries: [US]
  tags: [masters, fully-funded, eligibility-risk, verified-2026-08-08]
  notes: >
    Cycle runs 1 February to 30 June (15:00 Jordan time), not March as
    previously recorded here. Funds up to two years toward a US master's.
    ELIGIBILITY RISK: the commission requires applicants to reside in Jordan
    throughout the application and selection process. Confirm with the Amman
    office whether studying in North Cyprus disqualifies you before spending
    time on this. Preference for candidates who have not previously lived in
    the US.

- name: Fulbright Jordan — final deadline
  url: https://www.fulbright.org.jo/jordanian-programs/jordanian-student-scholarship
  deadline: 2027-06-30
  kind: scholarship
  org: Jordanian-American Commission for Educational Exchange
  countries: [US]
  tags: [masters, fully-funded, verified-2026-08-08]
  notes: Closes 15:00 Jordan time. See the February entry for the eligibility caveat.

- name: EURAXESS / MSCA doctoral positions — sweep
  url: https://euraxess.ec.europa.eu/jobs
  deadline: 2027-03-01
  kind: fellowship
  org: European Commission
  countries: [DE, NL, SE, FR, ES, IT, BE, AT, DK, FI]
  tags: [phd, salaried, rolling, verified-2026-08-08]
  notes: >
    Correction to the previous entry: the MSCA Doctoral Networks call
    (24 November 2026) is for university consortia bidding for funding, not
    for individual candidates — it is not something you apply to. Funded
    networks then advertise salaried PhD posts on EURAXESS year-round, which
    is what you actually watch. The 2026 call funds ~2,115 doctoral posts
    including a new AI-for-science strand, so recruitment ramps up during
    2027. Mobility rules generally favour applicants who have not recently
    lived in the host country.

