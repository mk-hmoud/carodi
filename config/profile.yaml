# Who you are and what counts as a match.
# This file is the whole filter. Tune it with `carodi run --dry-run --explain`
# until the rejection breakdown stops throwing away things you wanted.

identity:
  nationality: JO
  based_in: CY
  graduating: 2027-06        # ~1 year out; internships and new-grad roles are in scope
  # Cyprus is EET/EEST. Boards that state a remote role's permitted timezone
  # band numerically let carodi tell "remote" from "remote, US hours".
  utc_offsets: [2, 3]

# Onsite roles outside this list are rejected outright; everything on it is
# ranked by scoring.country_bonus below. Membership answers "should I ever see
# this?", the weight answers "how much should I care?" -- so somewhere hard to
# reach belongs on the list at a low weight, not off it.
# Quoted because YAML 1.1 parses bare NO (Norway) as boolean false.
target_countries: [
  # UK + Ireland
  "GB", "IE",
  # Western / Northern Europe
  "DE", "NL", "SE", "DK", "NO", "FI", "IS", "CH", "AT", "BE", "LU", "FR",
  # Southern Europe
  "ES", "PT", "IT", "GR", "MT", "CY",
  # Central / Eastern Europe
  "PL", "CZ", "SK", "SI", "HR", "HU", "RO", "BG", "EE", "LV", "LT",
  # North America
  "US", "CA",
  # Türkiye -- recognises TRNC degrees, and Jordanians have straightforward
  # work access. On paper the most reachable destination on this list.
  "TR",
  # Gulf -- hires Jordanians readily, no lottery, no degree-recognition
  # question. Employment visas are employer-sponsored as a matter of course.
  "AE", "SA", "QA", "KW", "BH",
  # Asia-Pacific -- points-based or employer-led skilled routes.
  "AU", "NZ", "SG", "JP", "KR",
]

remote:
  accept: true
  accept_anywhere: true      # "work from anywhere" postings
  accept_eu_wide: true       # "remote (Europe)" / EMEA / CET-timezone postings

hard_filters:
  # Onsite roles in countries that publish a sponsor register must be at an
  # employer on that register. This is the single highest-value rule here.
  require_sponsor_if_onsite: true
  sponsor_required_countries: [GB, NL]

  max_age_days: 45

  # You are ~1 year from a master's. These titles are not going to sponsor a
  # new grad, and they dominate every board.
  exclude_titles:
    - senior
    - staff
    - principal
    - lead
    - head of
    - director
    - vp
    - vice president
    - manager
    - architect
    - fellow engineer
    - distinguished
    # Contracts requiring enrolment at a university in that country. A German
    # Werkstudent contract needs a German university place; you are enrolled in
    # North Cyprus, so these are not roles you can hold whatever the fit.
    # Delete these lines if you ever enrol inside the EU.
    - werkstudent
    - werkstudentin
    - working student
    - praktikum
    - praktikant
    - duales studium
    - ausbildung
    # Functions that are not yours. must_any should catch these now, but a
    # title like "Sales Engineer" carries a field word by accident.
    - sales
    - marketing
    - recruiter
    - talent acquisition
    - controlling
    - office management
    - customer success
    - business development

  # Phrases that reliably mean "you specifically cannot take this job".
  exclude_phrases:
    - security clearance
    - us citizen
    - us citizenship
    - citizens only
    - permanent resident
    - green card
    - must be authorized to work
    - no visa sponsorship
    - visa sponsorship is not available
    - unable to sponsor
    - not able to sponsor
    - active clearance
    - polygraph

keywords:
  # Where must_any is checked. "title" is strongly recommended: job descriptions
  # name every technology a company touches, so checking "all" lets sales and HR
  # roles through on the strength of boilerplate.
  must_any_scope: title

  # FIELD keywords only -- never employment type. "intern" and "working
  # student" used to live here, which meant "Sales Intern" satisfied the
  # is-this-my-field check on the word "intern". Whether a role is an
  # internship is a separate question from whether it is engineering, and
  # mixing the two let every function in the company through.
  must_any:
    - software engineer
    - software developer
    - software engineering
    - backend
    - back end
    - frontend
    - front end
    - full stack
    - fullstack
    - platform engineer
    - infrastructure engineer
    - systems engineer
    - site reliability
    - devops
    - embedded
    - firmware
    - computer engineer
    - computer engineering
    - data engineer
    - machine learning
    - ml engineer
    - research engineer
    - security engineer
    - mobile engineer
    - android developer
    - ios developer
    - developer
    - softwareentwickler        # German postings rarely say "software engineer"
    - softwareentwicklung
    - informatik

  # Weights are arbitrary; only their ratios matter. Edit freely.
  # Matched against the whole posting, punctuation intact — "c++" and "node.js"
  # match literally, and "go" will not fire inside "golang".
  boost:
    graduate program: 6
    new grad: 6
    internship: 5
    junior: 4
    entry level: 4
    visa sponsorship: 6
    relocation: 5
    relocation package: 5
    blue card: 6
    skilled worker: 4
    python: 3
    typescript: 2
    golang: 2
    rust: 2
    c++: 2
    embedded: 2
    kubernetes: 1
    distributed systems: 2
    "0-2 years": 4
    "1-3 years": 3
    "2+ years": 1

  penalize:
    "5+ years": -4
    "7+ years": -6
    "8+ years": -6
    "10+ years": -8
    on-call rotation: -1
    unpaid: -6
    equity only: -6
    commission only: -6

scoring:
  threshold: 6             # raise this when the digest gets noisy

  target_country_bonus: 3  # weight for any target country not named below

  # Tiered by how reachable the country actually is, not by how much you like
  # it. Tier 1 is where eligibility is *checkable* -- both publish a public
  # register of licensed sponsors, so carodi can verify a specific employer can
  # hire you rather than guessing.
  country_bonus:
    GB: 6
    NL: 6
    # Clear employer-led routes: Ireland's Critical Skills permit, Germany's
    # EU Blue Card.
    IE: 5
    DE: 5
    # Strong tech markets with workable skilled-migration routes.
    SE: 4
    DK: 4
    FI: 4
    "NO": 4
    CH: 4
    AT: 4
    BE: 4
    LU: 4
    FR: 4
    ES: 4
    PT: 4
    # Smaller or tougher markets, still genuinely reachable.
    IT: 3
    PL: 3
    CZ: 3
    EE: 3
    LT: 3
    LV: 3
    SK: 3
    SI: 3
    HR: 3
    HU: 3
    RO: 3
    BG: 3
    GR: 3
    MT: 3
    IS: 3
    # Republic of Cyprus -- EU, and you are already on the island. Note this is
    # not the TRNC: crossing means an EU work permit like anywhere else.
    CY: 3
    # In scope but bottom-ranked. No sponsor register to check against, and the
    # H-1B is a lottery you cannot plan around. Kept visible because a good
    # enough US role is still worth seeing -- it just should not outrank a
    # Dutch job at a verified sponsor.
    US: 1
    CA: 2
    # Outside the original EU/UK/US brief, so weighted mid-range: genuinely
    # reachable, but not the stated goal. These are guesses about your
    # preference rather than facts about the countries -- if you would take
    # Dubai over Warsaw, or vice versa, say so and these should move.
    TR: 3
    AE: 3
    SA: 2
    QA: 2
    KW: 2
    BH: 2
    AU: 3
    NZ: 2
    SG: 3
    JP: 3
    KR: 2

  # A remote role restricted to countries weighted below this is treated as
  # geographically closed. At floor 2, "remote (US only)" is penalised while
  # "remote (UK)" is not -- which is the whole point of weighting US at 1.
  remote_restriction_floor: 2

  # A remote role whose stated timezone band excludes yours.
  timezone_excluded: -8

  sponsor_bonus: 5

  # Facts read out of the posting text by the LLM stage. Score adjustments
  # only -- never rejections. See carodi/enrich_llm.py.
  llm:
    sponsorship_offered: 8
    sponsorship_denied: -12
    entry_level: 4
    per_excess_year: -1.5
    years_allowed: 2
    remote_excluded: -8
    # Enough to sink a role below the threshold on its own: a contract you
    # are not eligible to sign is not a near miss.
    requires_local_status: -14
