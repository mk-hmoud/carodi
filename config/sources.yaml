settings:
  db_path: data/carodi.db
  digest_limit: 20
  telegram_disable_preview: true

  # Reads job descriptions and extracts structured facts the regexes get wrong:
  # whether sponsorship is genuinely offered or denied, real years-of-experience
  # requirements, and whether a "remote" role is secretly geo-restricted.
  #
  # Runs after hard eligibility is settled and before scoring, so it can only
  # rank survivors -- never rescue a rejected role, and never reject one. Every
  # extracted fact is a score adjustment; see carodi/enrich_llm.py.
  #
  # Google Gemini rather than the Anthropic SDK used elsewhere: its free tier
  # covers this volume outright. Results are cached by fingerprint forever, so
  # a posting is read once and steady-state usage is only genuinely new roles.
  llm:
    enabled: true
    api_key_env: CARODI_GEMINI_API_KEY

    # Flash-Lite, not Flash. On the free tier the tiers are not close:
    #
    #   Gemini 3.6 Flash        5 RPM    20 RPD
    #   Gemini 3.1 Flash Lite  15 RPM   500 RPD
    #
    # 20 requests a day cannot drain a backlog and barely covers steady state,
    # so Flash is unusable here whatever its quality edge. Verified working via
    # `carodi llm --probe-models`; limits confirmed at https://ai.dev/rate-limit.
    #
    # Pinned rather than an alias (gemini-flash-lite-latest) because the pacing
    # below is derived from this model's RPM -- a moving target for the model
    # would make the throttle wrong without anything failing loudly.
    model: gemini-3.1-flash-lite

    # State the provider's limit; the interval is derived from it. Writing an
    # interval by hand means guessing, and the first live run guessed 9/min
    # against a 5 RPM ceiling -- every call failed and a day's quota went in
    # about two minutes.
    requests_per_minute: 15

    # Attempts per run, not successes. Well inside 500/day, and enough to clear
    # the whole backlog in one morning. Results cache forever, so steady state
    # is only genuinely new postings -- a couple of dozen a day.
    max_per_run: 80

    # Extraction is not a reasoning task, so thinking tokens are spend for no
    # gain -- but some models reject a zero budget, and the enricher drops the
    # option automatically when one does.
    disable_thinking: true

# Employer lists that can legally sponsor you. See carodi/enrichment/sponsors.py
# for where to download these; the URLs are dated and change on every update, so
# they are not hardcoded.
sponsor_registers:
  - country: GB
    path: data/registers/uk_licensed_sponsors.csv
    enabled: true
    # The register covers every sponsorship route, most of which cannot hire a
    # software engineer: Charity Worker, Creative Worker, Ministers of Religion,
    # Seasonal Worker. The Global Business Mobility routes are excluded too --
    # they require you to already work for the group overseas, so they are no
    # use for a cold application. Drop this list to match on any route.
    routes: ["Skilled Worker", "Scale-up"]
    route_column: "Route"

  - country: NL
    path: data/registers/nl_recognised_sponsors.csv
    enabled: true
    # IND publishes one register per purpose; this is the highly-skilled-migrant
    # one, so every row already qualifies and there is no route column.
    name_column: "name"

sources:
  # -- curated deadline calendar ------------------------------------------
  # Not a scraper. Re-announces hand-maintained entries as they approach.
  - type: deadlines
    enabled: true
    params:
      name: calendar
      file: config/deadlines.yaml
      alerts: [120, 90, 60, 30, 14, 7, 3, 1]
      # Days of catch-up after a threshold passes, so a missed run (VPS down,
      # a failed digest) still delivers the alert instead of losing it. The
      # alert title carries the threshold rather than the exact days left, so
      # the extra days dedupe to one notification.
      window: 3

  # -- ATS boards ---------------------------------------------------------
  # The highest-signal source available. Add companies you would actually
  # work for; the board token is the last path segment of their careers URL.
  # Verify each token with: carodi check greenhouse
  # Every token below was verified to return 200 on 2026-08-07. Companies move
  # between ATS vendors, so a 404 here means "look up their careers page again",
  # not "carodi is broken" -- the run continues either way.
  - type: greenhouse
    enabled: true
    params:
      name: greenhouse
      boards:
        - monzo
        - gocardless
        - cloudflare
        - datadog
        - elastic
        - airbnb
        - stripe
        - databricks
        - figma

  - type: lever
    enabled: true
    params:
      name: lever
      boards:
        - spotify
        - plaid

  - type: ashby
    enabled: true
    params:
      name: ashby
      boards:
        - ramp
        - linear
        - vercel
        - deel
        - posthog

  # -- open job APIs ------------------------------------------------------
  - type: json_board
    enabled: true
    params:
      name: remotive
      url: https://remotive.com/api/remote-jobs?category=software-dev
      items_path: jobs
      title_field: title
      org_field: company_name
      url_field: url
      location_field: candidate_required_location
      description_field: description
      tags_field: tags

  - type: json_board
    enabled: true
    params:
      name: arbeitnow
      url: https://www.arbeitnow.com/api/job-board-api
      items_path: data
      title_field: title
      org_field: company_name
      url_field: url
      location_field: location
      description_field: description
      tags_field: tags

  # -- national employment services ---------------------------------------
  # Sweden's Arbetsförmedlingen publishes every ad in Platsbanken as an open
  # API: no key, no registration, ~45k live vacancies. Authoritative, free, and
  # nobody is defending it against you.
  - type: jobtech
    enabled: true
    params:
      name: jobtech-se
      queries:
        - software engineer
        - software developer
        - backend
        - utvecklare          # Swedish postings often use only the local term
        - systemutvecklare
        - embedded
      limit: 100

  # Germany's Bundesagentur für Arbeit -- the largest German job database,
  # open with no registration. Note /pc/v6/: the same documented header returns
  # 403 on v4, which reads like the whole API is gated when it is not.
  - type: arbeitsagentur
    enabled: true
    params:
      name: arbeitsagentur-de
      queries: [Softwareentwickler, Software Engineer, Backend, Embedded]
      size: 50
      published_since: 7

  # -- remote-first boards ------------------------------------------------
  # Himalayas states each remote role's permitted timezone band as UTC offsets,
  # which is the only unambiguous way to tell "remote" from "remote, US hours".
  - type: himalayas
    enabled: true
    params:
      name: himalayas
      pages: 5

  # -- feeds --------------------------------------------------------------
  # Arbeitnow runs a separate UK instance on the same schema. GB is your
  # highest-weighted country, so it is worth both.
  - type: json_board
    enabled: true
    params:
      name: arbeitnow-uk
      url: https://www.arbeitnow.co.uk/api/job-board-api
      items_path: data
      title_field: title
      org_field: company_name
      url_field: url
      location_field: location
      description_field: description
      tags_field: tags

  # EURAXESS -- the European Commission's research-jobs portal. PhD positions
  # and salaried research posts, which for a master's graduate is a relocation
  # route in its own right.
  - type: rss
    enabled: true
    params:
      name: euraxess
      url: https://euraxess.ec.europa.eu/job-feed

  - type: rss
    enabled: true
    params:
      name: weworkremotely
      url: https://weworkremotely.com/categories/remote-programming-jobs.rss
      org_from_title: true
      separator: ":"

  # -- freeform -----------------------------------------------------------
  # Noisy, but surfaces roles that never reach a job board. The filter earns
  # its keep here.
  - type: hn_whoishiring
    enabled: true
    params:
      name: hn
      limit: 400
